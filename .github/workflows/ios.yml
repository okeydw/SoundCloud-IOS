name: iOS

on:
  workflow_dispatch:
  push:
    branches: [dev/ios, main]

permissions:
  contents: read

jobs:
  ipa:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ipa]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build app
        run: |
          set -o pipefail
          chmod +x gradlew
          xcodebuild \
            -project iosApp/SoundCloud.xcodeproj \
            -scheme SoundCloud \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcode-out.log | grep -E "error|warning: unable|BUILD" || true
          test -d build/ios/Build/Products/Release-iphoneos/SoundCloud.app

      - name: Package IPA and TIPA
        run: |
          VERSION=$(./gradlew -q :app:printVersionName | tail -n 1)
          APP=build/ios/Build/Products/Release-iphoneos/SoundCloud.app
          ldid -SiosApp/SoundCloud.entitlements "$APP/SoundCloud"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry "SoundCloud-iOS-$VERSION.ipa" Payload
          cp "SoundCloud-iOS-$VERSION.ipa" "SoundCloud-iOS-$VERSION.tipa"
          ls -la *.ipa *.tipa

      - name: Inspect bundle
        run: |
          APP=Payload/SoundCloud.app
          {
            echo "size: $(du -sh "$APP" | cut -f1)"
            echo "binary: $(lipo -info "$APP/SoundCloud" 2>&1 | sed 's/.*are: //')"
            echo "compose resources: $(find "$APP" -path '*compose-resources*' -type f | wc -l | tr -d ' ')"
            echo "strings: $(find "$APP" -path '*compose-resources*' -name 'strings*.cvr' | wc -l | tr -d ' ')"
            echo "fonts: $(find "$APP" -path '*compose-resources*' -name '*.ttf' | wc -l | tr -d ' ')"
            echo "background audio: $(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$APP/Info.plist" 2>&1)"
            echo "url scheme: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$APP/Info.plist" 2>&1)"
            echo "icon: $(ls "$APP" | grep -c AppIcon)"
            ldid -e "$APP/SoundCloud" | tr -d '\n' | head -c 300
          } > bundle.txt
          cat bundle.txt
          echo "::notice title=Bundle::$(tr '\n' ';' < bundle.txt | tr -d '%<>')"

      - name: Report build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          text = ''
          for f in ['xcode-out.log']:
              try:
                  lines = open(f, encoding='utf-8', errors='replace').read().splitlines()
              except FileNotFoundError:
                  continue
              picked = []
              for i, l in enumerate(lines):
                  if re.search(r'(^e: |error:|What went wrong|FAILED)', l):
                      picked.append(l)
                      if 'Exception during generating code' in l or 'What went wrong' in l:
                          picked.extend(lines[i + 1:i + 6])
              picked = [re.sub(r'file://\S*?/(app|core|ui)/src/(\w+)/(kotlin|java)/com/scd/android/', r'\1/\2/', l) for l in picked]
              text += '\n'.join(dict.fromkeys(picked))
          text = text[:120000] or 'no error lines captured'
          esc = lambda t: t.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          chunks = [text[k:k + 4000] for k in range(0, len(text), 4000)]
          for n, c in enumerate(chunks[:30]):
              kind = ['error', 'warning', 'notice'][n // 10]
              print('::' + kind + ' title=iOS build ' + str(n + 1) + '::' + esc(c))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            SoundCloud-iOS-*.ipa
            SoundCloud-iOS-*.tipa
          if-no-files-found: error
          retention-days: 14
