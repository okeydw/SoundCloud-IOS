name: SoundCloud
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.4.6"
    CURRENT_PROJECT_VERSION: "12"
targets:
  SoundCloud:
    type: application
    platform: iOS
    sources:
      - SoundCloud
      - Shared
    dependencies:
      - target: SoundCloudWidget
        embed: true
    scheme: {}
    info:
      path: SoundCloud/Info.plist
      properties:
        CFBundleDisplayName: SoundCloud
        SoundCloudAppGroup: group.com.scd.ios
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: The camera is used to scan sign-in QR codes.
        CFBundleURLTypes:
          - CFBundleURLName: com.scd.ios
            CFBundleURLSchemes:
              - scd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scd.ios
        CODE_SIGN_ENTITLEMENTS: SoundCloud.entitlements
        PRODUCT_NAME: SoundCloud
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - SoundCloudUi
          - -framework
          - AVFoundation
          - -framework
          - MediaPlayer
          - -framework
          - CoreImage
          - -framework
          - Metal
          - -lc++
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :ui:embedAndSignAppleFrameworkForXcode

  SoundCloudWidget:
    type: app-extension
    platform: iOS
    sources:
      - SoundCloudWidget
      - Shared
    info:
      path: SoundCloudWidget/Info.plist
      properties:
        CFBundleDisplayName: SoundCloud
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SoundCloudAppGroup: group.com.scd.ios
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scd.ios.widget
        PRODUCT_NAME: SoundCloudWidget
        CODE_SIGN_ENTITLEMENTS: SoundCloudWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
